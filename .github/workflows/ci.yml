name: Integración Continua (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar-codigo:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install

      - name: Verificar sintaxis (ESLint)
        run: bun run lint

      # `tsc -b`, no `tsc --noEmit`: el tsconfig.json raíz es una solución con
      # `"files": []` y referencias, y `tsc --noEmit` sobre él no revisa ningún
      # archivo. Los dos proyectos referenciados tienen `noEmit`, así que esto
      # comprueba sin generar salida.
      - name: Verificar Tipos (TypeScript)
        run: bun run typecheck

      - name: Ejecutar pruebas (Vitest)
        run: bun run test

      - name: Compilar (Vite)
        run: bun run build

      # La Edge Function importa módulos de src/. Sin este paso, un cambio en
      # src/ podría romper uno de esos imports mientras el frontend sigue
      # compilando, y el fallo solo aparecería al desplegar o al ejecutar la
      # función. Usa el mismo script que en local para que no haya dos formas
      # de comprobar lo mismo.
      - name: Verificar Edge Functions (Deno)
        run: bun run check:functions
