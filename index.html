<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fintrack-theme')
          // Desde M17 solo hay tema claro y oscuro. Quien tenía guardado
          // «sistema» se queda, una sola vez y antes del primer pintado, con el
          // tema que su dispositivo muestra ahora: así nada cambia de golpe y la
          // preferencia pasa a ser explícita.
          if (stored === 'system') {
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            localStorage.setItem('fintrack-theme', stored)
          }
          if (stored === 'dark') document.documentElement.classList.add('dark')

          function updateFavicon() {
            var isDarkNow = document.documentElement.classList.contains('dark')
            document.getElementById('favicon').href = isDarkNow
              ? '/favicon-dark.png'
              : '/favicon-light.png'
          }
          updateFavicon()

          new MutationObserver(updateFavicon).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class'],
          })
        } catch (e) {}
      })();
    </script>
    <link id="favicon" rel="icon" type="image/png" href="/favicon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
